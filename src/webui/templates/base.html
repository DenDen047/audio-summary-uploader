<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画解説スタジオ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    /* ── Design tokens ──────────────────────────────────────────────
       主題は「澪（紫ノ宮澪＝紫）と透（麦野透＝透明感）の掛け合い解説スタジオ」。
       名前に由来する 紫→シアン のデュオ配色を署名要素に据える。
       サイドパネル常用のためナローファースト（基本＝縦積み）で組む。 */
    :root {
      --pico-font-size: 15px;
      --bg: #110f18;          /* 深い藍寄りの黒（純黒を避けインディゴを差す） */
      --surface: #1a1826;     /* カード・入力面 */
      --surface-2: #211f30;   /* さらに一段持ち上げた面 */
      --border: #322e46;
      --border-soft: #262338;
      --text: #ece9f6;
      --muted: #a29fb8;
      --mio: #b39dff;         /* 澪：紫ノ宮 → 紫 */
      --toru: #4fe0cf;        /* 透：麦野 → 透き通ったシアン */
      --grad: linear-gradient(120deg, #b39dff, #4fe0cf);
      --danger: #ff7a8a;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }
    [data-theme="dark"] {
      --pico-background-color: var(--bg);
      --pico-color: var(--text);
      --pico-muted-color: var(--muted);
      --pico-muted-border-color: var(--border-soft);
      --pico-primary: var(--mio);
      --pico-primary-hover: #c6b6ff;
      --pico-primary-focus: color-mix(in srgb, var(--mio) 35%, transparent);
      --pico-primary-inverse: #171528;
      --pico-form-element-background-color: var(--surface);
      --pico-form-element-border-color: var(--border);
      --pico-form-element-active-border-color: var(--mio);
      --pico-form-element-focus-color: var(--mio);
      --pico-form-element-color: var(--text);
      --pico-card-background-color: var(--surface);
      --pico-card-border-color: var(--border-soft);
      --pico-border-radius: 10px;
      --pico-del-color: var(--danger);
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 0.9rem;
      margin: 0 auto;
      max-width: 100%;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--toru);
      outline-offset: 2px;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.1rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px solid var(--border-soft);
    }
    header::after {   /* デュオ配色のアクセントレール（署名） */
      content: "";
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 64px;
      height: 2px;
      border-radius: 2px;
      background: var(--grad);
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.01em;
    }
    .header-subtitle {
      color: var(--muted);
      font-size: 0.76rem;
      margin: 0.2rem 0 0;
    }

    /* 稼働中を示す「オンエア」ピル。処理中のみ表示される。 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: color-mix(in srgb, var(--toru) 12%, var(--surface));
      color: var(--text);
      border: 1px solid color-mix(in srgb, var(--toru) 42%, transparent);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--toru);
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--toru) 55%, transparent);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--toru) 55%, transparent); }
      70%  { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    /* ── 入力エリア ───────────────────────────────────────────────── */
    .url-input-area {
      margin-bottom: 1.4rem;
    }
    .url-input-row {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .url-input-row textarea {
      width: 100%;
      min-width: 0;
      min-height: 4.5rem;
      margin-bottom: 0;
      resize: vertical;
    }
    .url-input-row button[type="submit"] {
      width: 100%;
      margin-bottom: 0;
      border: none;
      border-radius: 10px;
      background: var(--grad);
      color: #171528;
      font-weight: 700;
      letter-spacing: 0.04em;
      box-shadow: 0 4px 16px -7px color-mix(in srgb, var(--mio) 65%, transparent);
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
    }
    .url-input-row button[type="submit"]:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }
    .url-input-row button[type="submit"]:active {
      transform: translateY(0);
    }

    .options-row {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .options-row label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .options-row select {
      width: 100%;
      margin-bottom: 0;
      padding: 0.4rem 1.75rem 0.4rem 0.6rem;
      font-size: 0.88rem;
    }

    .legacy-options {
      margin-top: 0.75rem;
      font-size: 0.8rem;
    }
    .legacy-options summary {
      color: var(--muted);
    }
    .legacy-options .options-row {
      margin-top: 0.7rem;
    }

    /* ── セクション ───────────────────────────────────────────────── */
    section {
      margin-bottom: 1.6rem;
    }
    section h2 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 0.7rem;
      padding: 0;
      border: none;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    section h2::before {   /* デュオ配色のセクションティック */
      content: "";
      width: 4px;
      align-self: stretch;
      min-height: 1em;
      border-radius: 2px;
      background: var(--grad);
    }

    /* ── ジョブカード ─────────────────────────────────────────────── */
    .job-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .job-item {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.5rem 0.6rem;
      padding: 0.7rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      transition: border-color 0.12s ease;
    }
    .job-item:hover {
      border-color: var(--border);
    }
    .job-icon {
      font-size: 1.1rem;
      line-height: 1.4;
      flex-shrink: 0;
    }
    .job-info {
      flex: 1 1 60%;
      min-width: 0;
    }
    .mode-chip {
      display: inline-block;
      margin-bottom: 0.25rem;
      padding: 0.05rem 0.45rem;
      color: var(--mio);
      background: color-mix(in srgb, var(--mio) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--mio) 40%, transparent);
      border-radius: 999px;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .job-title {
      font-weight: 600;
      font-size: 0.9rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .job-title a {
      color: inherit;
      text-decoration: none;
    }
    .job-title a:hover {
      text-decoration: underline;
    }
    .job-status-text {
      margin-top: 0.15rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .job-error {
      margin-top: 0.25rem;
      font-size: 0.78rem;
      color: var(--danger);
      word-break: break-word;
    }

    /* サムネイル：ナローでは上に全幅で載せる（YouTube のカード風） */
    .job-thumbnail {
      order: -1;
      flex: 0 0 100%;
      overflow: hidden;
      border-radius: 9px;
      border: 1px solid var(--border);
      line-height: 0;
    }
    .job-thumbnail img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .artifact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.75rem;
      margin-top: 0.4rem;
      font-size: 0.76rem;
    }
    .artifact-links a {
      color: var(--toru);
      text-decoration: none;
    }
    .artifact-links a:hover {
      text-decoration: underline;
    }

    .upload-info {
      margin-top: 0.5rem;
      font-size: 0.76rem;
    }
    .upload-info summary {
      color: var(--muted);
      cursor: pointer;
    }
    .upload-info > div {
      margin-top: 0.5rem;
    }
    .upload-info pre {
      margin: 0.2rem 0 0;
      padding: 0.6rem;
      max-height: 12rem;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.7rem;
      background: var(--surface-2);
      border-radius: 8px;
    }

    .job-actions {
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
      margin-left: auto;
    }
    .job-actions button,
    .job-actions a {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.2rem;
      border-radius: 6px;
      font-size: 1rem;
      line-height: 1;
      color: var(--muted);
      text-decoration: none;
    }
    .job-actions button:hover,
    .job-actions a:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .bulk-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.7rem;
    }
    .bulk-actions button {
      flex: 1 1 auto;
      margin-bottom: 0;
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      font-size: 0.78rem;
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.6rem 0.75rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    .htmx-indicator {
      opacity: 0;
      transition: opacity 200ms ease-in;
    }
    .htmx-request .htmx-indicator {
      opacity: 1;
    }

    /* ── ワイド表示（フルタブで開いた場合） ───────────────────────── */
    @media (min-width: 560px) {
      body {
        max-width: 820px;
        padding: 1.25rem 1.75rem;
      }
      header h1 { font-size: 1.4rem; }
      .header-subtitle { font-size: 0.82rem; }
      .url-input-row { flex-direction: row; }
      .url-input-row button[type="submit"] {
        width: auto;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .options-row {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 1rem;
      }
      .options-row label { flex: 0 0 auto; }
      .options-row select { width: auto; }
      .job-thumbnail {
        order: 0;
        flex: 0 0 172px;
      }
      .job-thumbnail img { width: 172px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
