# NotebookLM 設定
notebooklm:
  backend: "notebooklm-py"  # "notebooklm-py" or "playwright"
  audio_language: "ja"
  audio_length: "short"     # グローバルデフォルト: "short" | "default"
  generation_timeout_seconds: 1200
  generation_poll_interval_seconds: 10
  # AI画像生成(サムネ/背景)専用の notebooklm プロファイル。本体(default)とセッションを
  # 分離して cookie の取り合いを防ぐ。初回: uv run notebooklm login --profile imagegen
  image_profile: "imagegen"

  prompt_presets:
    default: >
      この内容を日本語で要約してポッドキャスト形式で説明してください。
      専門用語は必要に応じて英語のまま使ってください。
    paper_summary: >
      - 解説は日本語で、丁寧な言葉遣いのポッドキャスト風にお願いします。
      - 想定リスナーは、AIや機械学習に関心のあるエンジニアやビジネスパーソンで、
        通勤や作業中の「ながら聞き」です。リスナー個人の属性（職業・経歴・年齢など）には
        言及しないでください。
      - まず、論文が解決しようとした問題設定と、それがなぜ難しいのかを説明してください。
      - キーアイディアは、具体例や比喩を使って直感的にわかる形で解説してください。
      - 関連する数学的な概念は、数式を読み上げずに直感的な意味を説明してください。
      - 専門用語は英語のまま使って構いませんが、初出時に一言だけ補足を添えてください。
      - 既存手法や有名な技術との類似点・相違点にも簡潔に触れてください。
      - 対象の研究分野の全体感やトレンドにも触れてください。
      - 最後に「結局何がすごいのか・何に使えるのか」が印象に残るように締めてください。

# YouTube 設定
youtube:
  privacy_status: "unlisted"
  category_id: "27"              # Education
  playlist_id: null  # 既定（default/未設定カテゴリのフォールバック）。null なら追加しない
  # ③ カテゴリ→プレイリストID。匿名チャンネルでプレイリスト作成後、コメントを外して
  # 各 list=PLxxxx を貼る。キー名はコード内カテゴリと完全一致させること。詳細は
  # docs/setup-anonymous-channel.md。空(={})なら全カテゴリが playlist_id にフォールバック。
  playlists:
    paper: "PLA0Klr4vdLWw"        # 📄 論文
    news: "PLWYM5SqxKgPA"         # 🗞 ニュース
    engineering: "PLDc6epVR_YBU"  # 🛠 開発
    business: "PLQnWruh8SOAw"     # 💰 ビジネス
  all_playlist_id: "PLfUwVQINu3ec"  # 全ての動画（カテゴリ別に加えて常に追加）
  title_prefix: "🎧"
  title_max_length: 95
  generated_title_max_length: 35   # ② chat 生成タイトルの全角字数上限
  default_tags:
    - "NotebookLM"
    - "Audio Summary"
    - "AI"
    - "音声要約"
  daily_upload_limit: 5

# サムネイル設定
thumbnail:
  width: 1280
  height: 720
  overlay_opacity: 0.5
  font_name: "NotoSansJP-Bold"
  title_font_size_max: 80
  title_font_size_min: 44
  subtitle_font_size: 24
  text_color: "#FFFFFF"
  # 講義動画サムネの意味モチーフをローカルSVGで描画する（従量課金APIなし）。
  background_mode: "codex-svg"  # "codex-svg" | "static"

# 認証情報パス
credentials:
  youtube_client_secret: "./credentials/youtube_client_secret.json"
  youtube_token: "./credentials/youtube_token.json"

# 一般設定
general:
  tmp_dir: "./tmp"
  state_file: "./data/state.json"
  max_retries: 3
  retry_backoff_base: 2
  # 簡易動画モード: true にすると AIサムネ/背景を作らず、カスタムサムネも設定せず
  # グラデーション静止背景の動画を高速生成する（サムネ上限 429 の回復中などに使う）。
  # 通常運用（顔＋文字サムネ・AI背景あり）は false。
  simple_video_mode: false

# 澪・透の講義動画設定
lecture:
  # Claude Maxで初稿、ChatGPT Codexで技術・編集審査。どちらも最高品質設定。
  script_model: "opus"
  script_effort: "xhigh"
  review_model: "gpt-5.6-sol"
  review_effort: "xhigh"
